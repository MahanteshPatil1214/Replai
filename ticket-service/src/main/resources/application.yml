server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ticket-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/replai}
    username: ${POSTGRES_USER:replai}
    password: ${POSTGRES_PASSWORD:replai}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        max.block.ms: 5000

logging:
  level:
    com.replai: INFO
